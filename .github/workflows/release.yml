name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: x64-windows
            binary: woman.exe
          - os: macos-latest
            suffix: aarch64-apple
            binary: woman
          - os: macos-latest
            suffix: x64-apple
            binary: woman
            cargo_target: x86_64-apple-darwin
          - os: ubuntu-latest
            suffix: x64-linux
            binary: woman

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          targets: ${{ matrix.cargo_target }}

      - run: cargo build --release ${{ matrix.cargo_target && format('--target {0}', matrix.cargo_target) || '' }}

      - name: Rename binary with version
        shell: bash
        run: |
          src="${{ matrix.cargo_target && format('target/{0}/release/{1}', matrix.cargo_target, matrix.binary) || format('target/release/{0}', matrix.binary) }}"
          mv "$src" \
             woman-${{ github.ref_name }}-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: woman-${{ github.ref_name }}-${{ matrix.suffix }}
          path: woman-${{ github.ref_name }}-${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
