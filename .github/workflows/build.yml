name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: x64-windows
            binary: woman.exe
          - os: macos-latest
            suffix: aarch64-apple
            binary: woman
          - os: macos-latest
            suffix: x64-apple
            binary: woman
            cargo_target: x86_64-apple-darwin
          - os: ubuntu-latest
            suffix: x64-linux
            binary: woman

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          targets: ${{ matrix.cargo_target }}

      - name: Build (debug + tests)
        if: ${{ !matrix.cargo_target }}
        run: cargo test

      - name: Build (release)
        run: cargo build --release ${{ matrix.cargo_target && format('--target {0}', matrix.cargo_target) || '' }}

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: woman-${{ matrix.suffix }}
          path: ${{ matrix.cargo_target && format('target/{0}/release/{1}', matrix.cargo_target, matrix.binary) || format('target/release/{0}', matrix.binary) }}
          if-no-files-found: error
