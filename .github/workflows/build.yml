name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: x64-windows
            binary: woman.exe
          - os: macos-latest
            suffix: aarch64-apple
            binary: woman
          - os: macos-13
            suffix: x64-apple
            binary: woman
          - os: ubuntu-latest
            suffix: x64-linux
            binary: woman

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build (debug + tests)
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: woman-${{ matrix.suffix }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
